<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Legacy Player</title>
<style>
:root{--bg:#050816;--panel:rgba(22,30,64,.58);--panel2:rgba(255,255,255,.07);--line:rgba(255,255,255,.13);--text:#eef1ff;--mute:#a3b2e0;--accent:#4f8cff;--accent2:#3be0a8;--warn:#ffb454;--bad:#ff6b7a;--r:16px;--grad:linear-gradient(135deg,#4f8cff,#7a5cff 55%,#3be0a8);--glow:0 0 22px rgba(79,140,255,.45);--chrome:rgba(8,12,30,.72)}
[data-theme=light]{--bg:#eef2fb;--panel:rgba(255,255,255,.78);--panel2:rgba(30,50,120,.07);--line:rgba(30,50,120,.16);--text:#141a36;--mute:#4d5a8f;--accent:#2f62e0;--accent2:#0b8f6c;--warn:#a85a00;--bad:#c92a3b;--glow:0 0 18px rgba(47,98,224,.28);--chrome:rgba(255,255,255,.82)}
*{box-sizing:border-box}
html{scrollbar-color:#3a4a8a transparent}
body{margin:0;color:var(--text);font:15px/1.5 "Segoe UI Variable","Segoe UI",system-ui,Roboto,sans-serif;background:var(--bg);min-height:100vh}
button,input,select{font:inherit;color:inherit}
option{background:#141a33;color:#eef1ff}
[data-theme=light] option{background:#fff;color:#141a36}
/* living background: drifting waves and soft light, like a console dashboard */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(1100px 700px at 12% -8%,#1c2f80 0%,transparent 60%),radial-gradient(900px 620px at 98% 8%,#0d6a6a 0%,transparent 55%),linear-gradient(180deg,#090e2c,#050816)}
[data-theme=light] .bg{background:radial-gradient(1100px 700px at 12% -8%,#c9d8ff 0%,transparent 60%),radial-gradient(900px 620px at 98% 8%,#c6f5e6 0%,transparent 55%),linear-gradient(180deg,#f3f6ff,#e6ecf9)}
.bg svg{position:absolute;left:-10%;width:140%;bottom:0;height:40vh;opacity:.3}
.bg svg path{fill:url(#wg)}
.bg .w1{animation:drift 26s ease-in-out infinite alternate}.bg .w2{bottom:-4vh;opacity:.22;animation:drift 38s ease-in-out infinite alternate-reverse}.bg .w3{bottom:-9vh;opacity:.16;animation:drift 52s ease-in-out infinite alternate}
.orb{position:absolute;border-radius:50%;filter:blur(60px);opacity:.35;animation:float 18s ease-in-out infinite alternate}
.o1{width:380px;height:380px;background:#4f8cff;left:8%;top:18%}.o2{width:320px;height:320px;background:#3be0a8;right:6%;top:42%;animation-duration:24s}
@keyframes drift{from{transform:translateX(-4%)}to{transform:translateX(6%)}}
@keyframes float{from{transform:translate(0,0)}to{transform:translate(40px,-30px)}}
/* window chrome: menu bar then brand and tabs */
.chrome{position:sticky;top:0;z-index:30;background:var(--chrome);backdrop-filter:blur(18px) saturate(1.3);border-bottom:1px solid var(--line)}
#menubar{display:flex;align-items:center;gap:2px;padding:3px 10px;border-bottom:1px solid var(--line);font-size:.88rem}
.menu{position:relative}
.menu>button{background:none;border:0;padding:4px 12px;border-radius:6px;cursor:pointer;color:var(--text)}
.menu>button:hover,.menu.open>button{background:var(--panel2)}
.dd{position:absolute;top:100%;left:0;min-width:230px;padding:6px;border-radius:12px;background:var(--chrome);backdrop-filter:blur(22px);border:1px solid var(--line);box-shadow:0 18px 40px #0008;display:none;animation:pop .14s ease both}
.menu.open .dd{display:block}
.dd button{display:flex;width:100%;gap:10px;align-items:center;background:none;border:0;text-align:left;padding:7px 12px;border-radius:8px;cursor:pointer;color:var(--text)}
.dd button:hover,.dd button:focus-visible{background:var(--accent);color:#fff;outline:none}
.dd hr{border:0;border-top:1px solid var(--line);margin:5px 4px}
.who{display:flex;align-items:center;gap:8px;background:none;border:1px solid transparent;border-radius:999px;padding:2px 12px 2px 3px;cursor:pointer}
.who:hover{background:var(--panel2);border-color:var(--line)}.who .nm{font-size:.86rem}
header{display:flex;align-items:center;gap:18px;padding:8px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.wordmark{font-weight:800;letter-spacing:.4px;font-size:1.15rem}.wordmark b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{position:relative;background:none;border:0;padding:9px 16px;border-radius:10px;cursor:pointer;color:var(--mute);font-weight:600;transition:color .2s,background .2s}
nav button:hover{color:var(--text);background:var(--panel2)}
nav button.on{color:var(--text)}
nav button.on::after{content:"";position:absolute;left:14px;right:14px;bottom:2px;height:3px;border-radius:3px;background:var(--grad);box-shadow:var(--glow)}
#busybar{position:fixed;top:0;left:0;right:0;height:3px;z-index:60;opacity:0;transition:opacity .2s;background:linear-gradient(90deg,transparent,#4f8cff,#3be0a8,transparent);background-size:40% 100%;background-repeat:no-repeat;animation:slide 1.1s linear infinite}
body.busy #busybar{opacity:1}
@keyframes slide{from{background-position:-40% 0}to{background-position:140% 0}}
main{max-width:1240px;margin:0 auto;padding:22px 20px 60px}
main>*{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}main>*:nth-child(2){animation-delay:.04s}main>*:nth-child(3){animation-delay:.08s}main>*:nth-child(4){animation-delay:.12s}main>*:nth-child(n+5){animation-delay:.16s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}
h2{margin:.2em 0 .6em;font-size:1.5rem;letter-spacing:.2px}h3{margin:1em 0 .4em;font-size:1.05rem}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grow{flex:1}
.card,.panel{background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.025)),var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:0 10px 30px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.1)}
[data-theme=light] .card,[data-theme=light] .panel{box-shadow:0 8px 24px rgba(40,60,130,.12),inset 0 1px 0 #fff}
.btn{background:var(--panel2);border:1px solid var(--line);padding:8px 15px;border-radius:11px;cursor:pointer;transition:transform .12s,border-color .2s,box-shadow .2s}
.btn:hover{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,140,255,.18)}.btn:active{transform:scale(.97)}
.btn.primary{background:var(--grad);border-color:transparent;color:#fff;font-weight:600;box-shadow:0 6px 18px rgba(79,140,255,.35)}
.btn.good{background:linear-gradient(135deg,#34d399,#3be0a8);border-color:transparent;color:#04251c;font-weight:600}.btn.bad{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.modal{position:fixed;inset:0;background:#000b;backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:99;animation:rise .2s both}
.modalbox{background:var(--chrome);backdrop-filter:blur(24px);border:1px solid var(--line);border-radius:18px;padding:22px;max-width:460px;width:90%;box-shadow:0 30px 70px #000a}
input[type=text],input[type=number],input[type=search],select{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,140,255,.22)}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px;vertical-align:-3px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chip{padding:6px 13px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-size:.9rem;transition:all .15s}
.chip:hover{border-color:var(--accent)}.chip.on{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 4px 14px rgba(79,140,255,.35)}.chip small{opacity:.75;margin-left:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-top:12px}
.game{position:relative;padding:14px;border-radius:var(--r);background:linear-gradient(160deg,rgba(255,255,255,.1),rgba(255,255,255,.02)),var(--panel);border:1px solid var(--line);cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:128px;transition:transform .18s,border-color .2s,box-shadow .2s;overflow:hidden}
.game::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--grad);opacity:.7}
.game:hover,.game:focus-visible{border-color:var(--accent);outline:none;transform:translateY(-4px);box-shadow:0 14px 30px rgba(0,0,0,.4),var(--glow)}
.game .t{font-weight:650;line-height:1.25;padding-right:28px}.game .m{color:var(--mute);font-size:.82rem}
.star{position:absolute;top:8px;right:8px;background:none;border:0;font-size:1.25rem;cursor:pointer;color:var(--mute);transition:transform .15s}.star:hover{transform:scale(1.25) rotate(12deg)}.star.on{color:#ffcf40;text-shadow:0 0 10px #ffcf4088}
.badge{display:inline-block;font-size:.72rem;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--mute)}
.badge.strong,.badge.good{color:var(--accent2);border-color:var(--accent2)}.badge.per-game{color:var(--accent);border-color:var(--accent)}
.badge.experimental,.badge.not-practical{color:var(--warn);border-color:var(--warn)}
.list .game{flex-direction:row;align-items:center;min-height:0;padding:10px 14px}
.muted{color:var(--mute)}.small{font-size:.85rem}.bad{color:var(--bad)}.good{color:var(--accent2)}.warn{color:var(--warn)}
.why{background:var(--panel2);border-left:3px solid var(--accent);padding:9px 14px;border-radius:10px;margin:8px 0 14px;color:var(--mute);font-size:.9rem}
.i{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;border:1px solid var(--mute);color:var(--mute);font-size:.7rem;cursor:pointer;margin-left:6px;background:none}
table{border-collapse:collapse;width:100%}td,th{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}th{color:var(--mute);font-weight:600;font-size:.82rem}
tr.avg td{border-top:2px solid var(--line)}
.code{font:700 2rem/1 ui-monospace,Consolas,monospace;letter-spacing:.12em;background:var(--panel2);padding:12px 18px;border-radius:12px;border:1px dashed var(--accent);display:inline-block}
.drawer{position:fixed;inset:0 0 0 auto;width:min(480px,100%);background:var(--chrome);backdrop-filter:blur(22px);border-left:1px solid var(--line);padding:20px;overflow:auto;z-index:48;box-shadow:-10px 0 40px #0008;animation:slidein .25s ease both}
@keyframes slidein{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
.scrim{position:fixed;inset:0;background:#0007;z-index:47}
#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:70;max-width:380px}
.toast{background:var(--chrome);backdrop-filter:blur(18px);border:1px solid var(--line);border-left:4px solid var(--accent);padding:10px 14px;border-radius:12px;box-shadow:0 10px 28px #0007;animation:toastin .3s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes toastin{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
.toast.warn{border-left-color:var(--warn)}.toast.err{border-left-color:var(--bad)}
.feed{max-height:240px;overflow:auto;display:flex;flex-direction:column;gap:6px}.feed div{padding:6px 10px;background:var(--panel2);border-radius:8px}.feed .warn{border-left:3px solid var(--warn)}
.pad{display:flex;gap:6px;flex-wrap:wrap}.pad span{padding:4px 10px;border-radius:8px;border:1px solid var(--line)}.pad span.hit{background:var(--accent2);color:#04251c;border-color:var(--accent2)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;background:var(--bad)}.dot.on{background:var(--accent2);animation:pulse 2s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(59,224,168,.7)}100%{box-shadow:0 0 0 10px rgba(59,224,168,0)}}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
details>summary{cursor:pointer;list-style:none}details>summary::-webkit-details-marker{display:none}
details.fold>summary{display:flex;align-items:center;gap:10px;padding:2px 0}details.fold>summary::before{content:"▸";color:var(--mute);transition:transform .2s}details.fold[open]>summary::before{transform:rotate(90deg)}
@media(max-width:600px){main{padding:12px}.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}}
.tv{padding:8px}.tvbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.tvgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.tvcard{padding:22px 14px;border-radius:16px;border:2px solid var(--line);background:var(--panel);backdrop-filter:blur(10px);min-height:90px;cursor:pointer;transition:transform .15s,border-color .15s}.tvcard.sel{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,140,255,.35),var(--glow);transform:scale(1.04)}.tvtitle{font-size:16px;font-weight:600}.tvhelp{margin-top:14px}
/* pixel art and Martin */
.px{image-rendering:pixelated;display:block}
.px .peye{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
@keyframes blink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}}
.martin{animation:bob 3.2s ease-in-out infinite;filter:drop-shadow(0 4px 10px rgba(79,140,255,.45))}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes hop{0%,100%{transform:translateY(0) scaleY(1)}40%{transform:translateY(-9px) scaleY(1.06)}70%{transform:translateY(0) scaleY(.92)}}
body.busy .brand .martin,.hop{animation:hop .55s ease-in-out infinite}
.cheer{animation:hop .8s ease-in-out 3}
.avatar{border-radius:10px;background:linear-gradient(145deg,#26336e,#141a3c);padding:3px;border:1px solid var(--line)}
.avatars{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
.avatars button{background:none;border:2px solid transparent;border-radius:14px;padding:3px;cursor:pointer;transition:transform .15s,border-color .15s}
.avatars button:hover{transform:translateY(-3px) scale(1.05)}.avatars button.on{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(59,224,168,.25)}
/* hero, flashy cards, shelves */
.hero{display:flex;gap:26px;align-items:center;padding:26px 28px;border-radius:22px;border:1px solid var(--line);position:relative;overflow:hidden;background:linear-gradient(120deg,rgba(79,140,255,.28),rgba(122,92,255,.18) 50%,rgba(59,224,168,.22)),var(--panel);box-shadow:0 16px 40px rgba(0,0,0,.35)}
.hero::after{content:"";position:absolute;inset:-40% -10% auto auto;width:420px;height:420px;background:radial-gradient(circle,rgba(255,255,255,.18),transparent 65%);animation:float 14s ease-in-out infinite alternate;pointer-events:none}
.hero h1{margin:0 0 4px;font-size:2rem;letter-spacing:.3px}.hero p{margin:4px 0;color:var(--mute);max-width:620px}
.flashes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin:18px 0}
.flash{position:relative;border-radius:18px;padding:18px 18px 20px;border:1px solid var(--line);overflow:hidden;background:linear-gradient(145deg,var(--c1),var(--c2));color:#fff;transition:transform .2s,box-shadow .2s;min-height:150px}
.flash:hover{transform:translateY(-5px) rotate(-.4deg);box-shadow:0 18px 36px rgba(0,0,0,.45)}
.flash::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.28),transparent);transform:skewX(-18deg);animation:shine 5.5s ease-in-out infinite}
.flash:nth-child(2)::after{animation-delay:1.2s}.flash:nth-child(3)::after{animation-delay:2.4s}.flash:nth-child(4)::after{animation-delay:3.6s}
@keyframes shine{0%,60%{left:-60%}100%{left:130%}}
.flash h3{margin:.6em 0 .3em;font-size:1.08rem;color:#fff}.flash p{margin:0;font-size:.88rem;color:rgba(255,255,255,.88)}
.shelf{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 12px}.shelf .game{min-width:220px;max-width:240px;flex:0 0 auto}
.featured{border:1px dashed var(--accent);background:linear-gradient(120deg,rgba(255,180,84,.14),rgba(255,107,122,.1)),var(--panel)}
.tag{display:inline-block;font-size:.68rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:2px 9px;border-radius:999px;background:var(--warn);color:#2a1800}
.pstat{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.bar{height:10px;border-radius:6px;background:var(--panel2);overflow:hidden}.bar>i{display:block;height:100%;border-radius:6px;background:var(--grad)}
.bar.live>i{width:40%;animation:slide2 1.2s ease-in-out infinite alternate}
@keyframes slide2{from{margin-left:0}to{margin-left:60%}}
.spin{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent2);animation:rot .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes rot{to{transform:rotate(360deg)}}
.dots::after{content:"";animation:dots 1.4s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.ip{display:inline-flex;align-items:center;gap:6px;font-family:ui-monospace,Consolas,monospace}
.eye{background:none;border:1px solid var(--line);border-radius:8px;padding:1px 6px;cursor:pointer;color:var(--mute);line-height:1}.eye:hover{color:var(--text);border-color:var(--accent)}
.eye svg{width:16px;height:16px;vertical-align:-3px}
#boot{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--bg);transition:opacity .5s .1s}
#boot.gone{opacity:0;pointer-events:none}
.wizsteps{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.sumrow{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001s!important;animation-iteration-count:1!important;transition:none!important}}
.martin{cursor:pointer}
#bubble{position:fixed;z-index:80;max-width:200px;padding:7px 12px;font:700 13px/1.2 ui-monospace,Consolas,monospace;letter-spacing:.5px;color:#14172a;background:#fff;pointer-events:none;
 box-shadow:-3px 0 #14172a,3px 0 #14172a,0 -3px #14172a,0 3px #14172a;animation:bub .25s steps(4) both}
#bubble::after{content:"";position:absolute;left:14px;bottom:-9px;width:6px;height:6px;background:#fff;box-shadow:-3px 0 #14172a,3px 0 #14172a,0 3px #14172a,-3px -3px #fff,3px -3px #fff}
@keyframes bub{from{transform:scale(.5);opacity:0}to{transform:none;opacity:1}}
.petheart{position:fixed;z-index:81;pointer-events:none;animation:heartup 1s ease-out forwards}
@keyframes heartup{from{transform:translateY(0) scale(.6);opacity:1}to{transform:translateY(-34px) scale(1.2);opacity:0}}
.martin.pet{animation:hop .35s ease-in-out 2}
/* menus, dialogs and the top bar are solid so nothing shows through them */
:root{--solid:#0b1030}[data-theme=light]{--solid:#ffffff}
.chrome,.dd,.modalbox,.drawer,.toast{background:var(--solid);backdrop-filter:none}
.dd{box-shadow:0 18px 40px #000a;z-index:40}
.doc{min-width:300px;max-width:380px;flex:0 1 380px;position:relative;z-index:1}
.doc .px.doctor{flex:0 0 auto;filter:drop-shadow(0 4px 10px rgba(59,224,168,.35));animation:bob 3.4s ease-in-out infinite}
.doc .px.doctor.worried{animation:shake .6s ease-in-out infinite;filter:drop-shadow(0 4px 10px rgba(255,180,84,.45))}
.doc .px.doctor.sad{animation:none;filter:grayscale(.4) drop-shadow(0 4px 10px rgba(79,140,255,.3))}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
.retro{flex:1;min-width:0;padding:8px 10px;background:#08150f;color:#6dff9a;font:700 11px/1.55 ui-monospace,Consolas,monospace;letter-spacing:.6px;text-transform:uppercase;box-shadow:-3px 0 #6dff9a,3px 0 #6dff9a,0 -3px #6dff9a,0 3px #6dff9a;margin:3px}
.retro .hd{color:#fff;margin-bottom:4px}.retro .w{color:#ffd23f}
.retro::after{content:"_";animation:blinkc 1s steps(1) infinite}@keyframes blinkc{50%{opacity:0}}
.worry{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0 0;font-size:.84rem}
.joinbox td,.joinbox th{font-size:.9rem}

.cv{display:block;width:100%;height:150px;object-fit:contain;border-radius:10px;background:linear-gradient(160deg,#1a2350,#0c1130);margin:-2px 0 6px}
.cv.blank{display:grid;place-items:center;font:800 1.7rem/1 ui-monospace,Consolas,monospace;letter-spacing:.08em;color:rgba(255,255,255,.55);background:linear-gradient(145deg,var(--bc1,#26336e),var(--bc2,#141a3c))}

   "For RetroArch consoles Legacy Player gives every console its own tidy folder (saves and save states) under one root and passes it to RetroArch each time it launches. Look at Saves to see the folders or move the root, for example into a OneDrive or Dropbox folder if you want them synced.",

/* ---------- Warm-up track: something to drive while you wait ---------- */
function warmupTrack(container){

  ctx.clearRect(0,0,W,H);ctx.lineWidth=Rw*2;ctx.strokeStyle="#2a2f55";ctx.beginPath();ctx.ellipse(cx,cy,Rx,Ry,0,0,Math.PI*2);ctx.stroke();

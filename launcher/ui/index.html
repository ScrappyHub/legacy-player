<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Legacy Player</title>
<meta name="theme-color" content="#050816">
<style>
:root{--bg:#050816;--panel:rgba(22,30,64,.58);--panel2:rgba(255,255,255,.07);--line:rgba(255,255,255,.13);--text:#eef1ff;--mute:#b9c5ea;--link:#8fb2ff;--grad-btn:linear-gradient(135deg,#2f62e0,#6a48f0 55%,#07805e);--accent:#4f8cff;--accent2:#3be0a8;--warn:#ffb454;--bad:#ff8c98;--r:16px;--grad:linear-gradient(135deg,#4f8cff,#7a5cff 55%,#3be0a8);--glow:0 0 22px rgba(79,140,255,.45);--chrome:rgba(8,12,30,.72)}
[data-theme=light]{--orb1:#4f8cff;--orb2:#3be0a8;--bg:#eef2fb;--panel:rgba(255,255,255,.78);--panel2:rgba(30,50,120,.07);--line:rgba(30,50,120,.16);--text:#141a36;--mute:#2b3566;--accent:#2f62e0;--link:#2f62e0;--accent2:#066f53;--warn:#a85a00;--bad:#c92a3b;--glow:0 0 18px rgba(47,98,224,.28);--chrome:rgba(255,255,255,.82)}
*{box-sizing:border-box}
html{scrollbar-color:#3a4a8a transparent}
body{margin:0;color:var(--text);font:15px/1.5 "Segoe UI Variable","Segoe UI",system-ui,Roboto,sans-serif;background:var(--bg);min-height:100vh}
button,input,select{font:inherit;color:inherit}
option{background:#141a33;color:#eef1ff}
[data-mode=light] option{background:#fff;color:#141a36}
/* colour themes: each changes the background, panels and accents; "dark" and "light" are above */
[data-theme=ocean]{--wave-mid:#0e7490;--bg:#031a24;--panel:rgba(8,40,56,.58);--accent:#38bdf8;--accent2:#34d399;--link:#7dd3fc;--grad-btn:linear-gradient(135deg,#0369a1,#0e7490 55%,#047857);--grad:linear-gradient(135deg,#38bdf8,#34d399);--glow:0 0 22px rgba(56,189,248,.42);--chrome:rgba(3,22,32,.74);--solid:#06222e}
[data-theme=ocean] .bg{background:radial-gradient(1100px 700px at 12% -8%,#0b4f6c 0%,transparent 60%),radial-gradient(900px 620px at 98% 8%,#0d6a5a 0%,transparent 55%),linear-gradient(180deg,#05243a,#031a24)}
[data-theme=forest]{--wave-mid:#3f8a2a;--bg:#04150c;--panel:rgba(10,38,22,.58);--accent:#4ade80;--accent2:#bef264;--link:#86efac;--grad-btn:linear-gradient(135deg,#15803d,#3f6212 55%,#0f766e);--grad:linear-gradient(135deg,#4ade80,#bef264);--glow:0 0 22px rgba(74,222,128,.42);--chrome:rgba(4,24,12,.74);--solid:#08210f}
[data-theme=forest] .bg{background:radial-gradient(1100px 700px at 12% -8%,#14532d 0%,transparent 60%),radial-gradient(900px 620px at 98% 8%,#3f6212 0%,transparent 55%),linear-gradient(180deg,#06200f,#04150c)}
[data-theme=sunset]{--wave-mid:#be185d;--bg:#1a0a10;--panel:rgba(50,20,24,.58);--accent:#fb923c;--accent2:#f472b6;--link:#fdba74;--grad-btn:linear-gradient(135deg,#c2410c,#be185d 55%,#9d174d);--grad:linear-gradient(135deg,#fb923c,#f472b6);--glow:0 0 22px rgba(251,146,60,.42);--chrome:rgba(30,12,16,.74);--solid:#2a1015}
[data-theme=sunset] .bg{background:radial-gradient(1100px 700px at 12% -8%,#7c2d12 0%,transparent 60%),radial-gradient(900px 620px at 98% 8%,#9d174d 0%,transparent 55%),linear-gradient(180deg,#2a0f14,#1a0a10)}
[data-theme=rose]{--wave-mid:#9333ea;--bg:#1c0b16;--panel:rgba(56,18,44,.58);--accent:#f472b6;--accent2:#c084fc;--link:#f9a8d4;--grad-btn:linear-gradient(135deg,#be185d,#7e22ce 55%,#6b21a8);--grad:linear-gradient(135deg,#f472b6,#c084fc);--glow:0 0 22px rgba(244,114,182,.42);--chrome:rgba(34,12,28,.74);--solid:#2a0f22}
[data-theme=rose] .bg{background:radial-gradient(1100px 700px at 12% -8%,#831843 0%,transparent 60%),radial-gradient(900px 620px at 98% 8%,#6b21a8 0%,transparent 55%),linear-gradient(180deg,#2b0f22,#1c0b16)}
[data-theme=violet]{--wave-mid:#4f46e5;--bg:#0d0820;--panel:rgba(32,20,70,.58);--accent:#a78bfa;--accent2:#60a5fa;--link:#c4b5fd;--grad-btn:linear-gradient(135deg,#6d28d9,#4338ca 55%,#1d4ed8);--grad:linear-gradient(135deg,#a78bfa,#60a5fa);--glow:0 0 22px rgba(167,139,250,.42);--chrome:rgba(16,10,40,.74);--solid:#170f33}
[data-theme=violet] .bg{background:radial-gradient(1100px 700px at 12% -8%,#4c1d95 0%,transparent 60%),radial-gradient(900px 620px at 98% 8%,#1e3a8a 0%,transparent 55%),linear-gradient(180deg,#160d33,#0d0820)}
[data-theme=crimson]{--wave-mid:#c2410c;--bg:#170507;--panel:rgba(48,14,16,.58);--accent:#f87171;--accent2:#fbbf24;--link:#fca5a5;--grad-btn:linear-gradient(135deg,#b91c1c,#9a3412 55%,#92400e);--grad:linear-gradient(135deg,#f87171,#fbbf24);--glow:0 0 22px rgba(248,113,113,.42);--chrome:rgba(30,8,10,.74);--solid:#240a0c}
[data-theme=crimson] .bg{background:radial-gradient(1100px 700px at 12% -8%,#7f1d1d 0%,transparent 60%),radial-gradient(900px 620px at 98% 8%,#451a03 0%,transparent 55%),linear-gradient(180deg,#240a0c,#170507)}
[data-theme=graphite]{--wave-mid:#64748b;--bg:#0c0d10;--panel:rgba(30,32,38,.58);--accent:#93c5fd;--accent2:#86efac;--link:#bfdbfe;--grad-btn:linear-gradient(135deg,#3f3f46,#52525b 55%,#475569);--grad:linear-gradient(135deg,#93c5fd,#86efac);--glow:0 0 22px rgba(147,197,253,.42);--chrome:rgba(14,15,18,.74);--solid:#17181c}
[data-theme=graphite] .bg{background:radial-gradient(1100px 700px at 12% -8%,#2a2f3a 0%,transparent 60%),radial-gradient(900px 620px at 98% 8%,#1f2937 0%,transparent 55%),linear-gradient(180deg,#14161b,#0c0d10)}
/* living background: drifting waves and soft light, like a console dashboard */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(1100px 700px at 12% -8%,#1c2f80 0%,transparent 60%),radial-gradient(900px 620px at 98% 8%,#0d6a6a 0%,transparent 55%),linear-gradient(180deg,#090e2c,#050816)}
[data-theme=light] .bg{background:radial-gradient(1100px 700px at 12% -8%,#c9d8ff 0%,transparent 60%),radial-gradient(900px 620px at 98% 8%,#c6f5e6 0%,transparent 55%),linear-gradient(180deg,#f3f6ff,#e6ecf9)}
/* background styles (Preferences > Look): the same theme colours, a different picture behind the app */
[data-bg=aurora] .bg svg{display:none}
[data-bg=aurora] .orb{opacity:.5;filter:blur(90px)}
[data-bg=aurora] .o1{width:60vw;height:50vh;left:-10%;top:-8%;animation-duration:30s}
[data-bg=aurora] .o2{width:55vw;height:46vh;right:-10%;top:30%;animation-duration:38s}
[data-bg=aurora] .bg::after{content:"";position:absolute;inset:-20%;background:conic-gradient(from 0deg at 50% 60%,transparent 0 55%,color-mix(in srgb,var(--accent) 38%,transparent) 65%,transparent 78%,color-mix(in srgb,var(--accent2) 30%,transparent) 88%,transparent);filter:blur(70px);animation:spin 60s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
[data-bg=grid] .bg svg,[data-bg=grid] .orb{display:none}
[data-bg=grid] .bg::before{content:"";position:absolute;left:-50%;right:-50%;bottom:-10%;height:80%;background:linear-gradient(color-mix(in srgb,var(--accent) 70%,transparent) 1px,transparent 1px) 0 0/100% 46px,linear-gradient(90deg,color-mix(in srgb,var(--accent) 70%,transparent) 1px,transparent 1px) 0 0/64px 100%;transform:perspective(420px) rotateX(62deg);transform-origin:50% 100%;-webkit-mask-image:linear-gradient(transparent,#000 70%);mask-image:linear-gradient(transparent,#000 70%);animation:gridgo 3.5s linear infinite}
@keyframes gridgo{to{background-position:0 46px,0 0}}
[data-bg=stars] .bg svg,[data-bg=stars] .orb{display:none}
[data-bg=stars] .bg::before,[data-bg=stars] .bg::after{content:"";position:absolute;inset:0;background-repeat:repeat}
[data-bg=stars] .bg::before{background-image:radial-gradient(1.5px 1.5px at 20px 30px,#fff,transparent),radial-gradient(1px 1px at 90px 120px,#fff9,transparent),radial-gradient(1.5px 1.5px at 160px 60px,#fff,transparent),radial-gradient(1px 1px at 230px 190px,#fff8,transparent),radial-gradient(2px 2px at 300px 90px,#fff,transparent);background-size:340px 240px;animation:twinkle 5s ease-in-out infinite alternate}
[data-bg=stars] .bg::after{background-image:radial-gradient(1px 1px at 60px 80px,#fff9,transparent),radial-gradient(1.5px 1.5px at 190px 150px,#fff,transparent),radial-gradient(1px 1px at 270px 20px,#fff8,transparent);background-size:290px 210px;animation:twinkle 7s ease-in-out -2s infinite alternate}
@keyframes twinkle{from{opacity:.35}to{opacity:1}}
[data-mode=light][data-bg=stars] .bg::before,[data-mode=light][data-bg=stars] .bg::after{filter:invert(1) opacity(.5)}
[data-bg=dots] .bg svg{display:none}
[data-bg=dots] .bg::before{content:"";position:absolute;inset:0;background:radial-gradient(color-mix(in srgb,var(--text) 22%,transparent) 1.4px,transparent 1.6px) 0 0/26px 26px;-webkit-mask-image:radial-gradient(ellipse at 50% 40%,#000,transparent 80%);mask-image:radial-gradient(ellipse at 50% 40%,#000,transparent 80%)}
[data-bg=crt] .bg svg,[data-bg=crt] .orb{display:none}
[data-bg=crt] .bg::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px);animation:crtroll 9s linear infinite}
[data-bg=crt] .bg::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%),linear-gradient(transparent 46%,color-mix(in srgb,var(--accent) 9%,transparent) 50%,transparent 54%);background-size:100% 100%,100% 240%;animation:crtbar 7s linear infinite,crtflick .12s steps(2) infinite}
@keyframes crtroll{to{background-position:0 6px}}@keyframes crtbar{from{background-position:0 0,0 -120%}to{background-position:0 0,0 120%}}@keyframes crtflick{50%{opacity:.94}}
[data-mode=light][data-bg=crt] .bg::before{background:repeating-linear-gradient(0deg,rgba(30,50,120,.1) 0 1px,transparent 1px 3px)}
[data-bg=bokeh] .bg svg{display:none}
[data-bg=bokeh] .orb{display:none}
[data-bg=bokeh] .bg::before,[data-bg=bokeh] .bg::after{content:"";position:absolute;inset:-10%;background-repeat:no-repeat}
[data-bg=bokeh] .bg::before{background-image:radial-gradient(circle,color-mix(in srgb,var(--accent) 38%,transparent) 0 40%,transparent 41%),radial-gradient(circle,color-mix(in srgb,var(--accent2) 34%,transparent) 0 40%,transparent 41%),radial-gradient(circle,color-mix(in srgb,var(--accent) 26%,transparent) 0 40%,transparent 41%),radial-gradient(circle,color-mix(in srgb,var(--accent2) 22%,transparent) 0 40%,transparent 41%);background-size:140px 140px,220px 220px,90px 90px,300px 300px;background-position:8% 20%,80% 12%,60% 70%,24% 86%;filter:blur(7px);animation:bokehA 28s ease-in-out infinite alternate}
[data-bg=bokeh] .bg::after{background-image:radial-gradient(circle,color-mix(in srgb,var(--accent2) 30%,transparent) 0 40%,transparent 41%),radial-gradient(circle,color-mix(in srgb,var(--accent) 30%,transparent) 0 40%,transparent 41%),radial-gradient(circle,color-mix(in srgb,var(--accent2) 24%,transparent) 0 40%,transparent 41%);background-size:170px 170px,110px 110px,260px 260px;background-position:40% 8%,92% 62%,6% 52%;filter:blur(12px);animation:bokehB 36s ease-in-out infinite alternate}
@keyframes bokehA{from{transform:translate(0,0)}to{transform:translate(-3%,4%)}}@keyframes bokehB{from{transform:translate(0,0)}to{transform:translate(4%,-3%)}}
#bitworld{display:none}
[data-bg=bitworld] .bg svg,[data-bg=bitworld] .orb,[data-bg=bitcity] .bg svg,[data-bg=bitcity] .orb,[data-bg=bitforest] .bg svg,[data-bg=bitforest] .orb{display:none}
[data-bg=bitworld] #bitworld,[data-bg=bitcity] #bitworld,[data-bg=bitforest] #bitworld{display:block;position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;opacity:.8}
[data-bg=scene] .bg svg,[data-bg=scene] .orb{display:none}
[data-bg=scene] #bitworld{display:block;position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;opacity:1}
[data-bg=scene] .bg::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,color-mix(in srgb,var(--bg) 34%,transparent),color-mix(in srgb,var(--bg) 60%,transparent) 55%,color-mix(in srgb,var(--bg) 72%,transparent))}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px}
.wtile{display:flex;flex-direction:column;gap:4px;text-align:left;padding:6px 6px 8px;border-radius:12px;border:2px solid var(--line);background:var(--panel2);color:var(--text);cursor:pointer;font:inherit;transition:transform .12s,border-color .15s}
.wtile:hover{border-color:var(--accent);transform:translateY(-2px)}.wtile.on{outline:3px solid var(--accent);outline-offset:1px;border-color:transparent}.wtile:focus-visible{outline:3px solid var(--text);outline-offset:1px}
.wtile .wthumb{width:100%;aspect-ratio:120/54;height:auto;border-radius:8px;image-rendering:pixelated;display:block;border:1px solid var(--line)}
.wtile b{font-size:.9rem;padding:0 2px}.wtile span{font-size:.74rem;color:var(--mute);padding:0 2px;line-height:1.3}
.themes .wsw{width:34px;height:34px;border-radius:8px;border:2px solid var(--line);padding:0;cursor:pointer;image-rendering:pixelated}
.themes .wsw.on{outline:3px solid var(--accent);outline-offset:2px}.themes .wsw:focus-visible{outline:3px solid var(--text);outline-offset:2px}
.worldfold>summary{padding:6px 0;flex-wrap:wrap}.worldfold>summary .small{margin-left:auto}
.tlabel{font:800 .68rem ui-monospace,Consolas,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:10px 0 6px}
[data-bg=plain] .bg svg,[data-bg=plain] .orb{display:none}
[data-bg=plain] .bg{background:var(--bg)!important}
@media(prefers-reduced-motion:reduce){.bg *,.bg::before,.bg::after{animation:none!important}}
.bgpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.bgpick button{display:flex;flex-direction:column;gap:6px;align-items:stretch;padding:6px;border-radius:12px;border:2px solid var(--line);background:var(--panel2);cursor:pointer;text-align:center;font-size:.8rem}
.bgpick button .tile{height:54px;border-radius:8px;border:1px solid var(--line);background-color:var(--bg)}
.bgpick button.on{outline:3px solid var(--accent);outline-offset:1px}.bgpick button:focus-visible{outline:3px solid var(--text);outline-offset:1px}
.themes{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.themes .sw{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);padding:0;cursor:pointer}
.themes .sw.on{outline:3px solid var(--accent);outline-offset:2px}.themes .sw:focus-visible{outline:3px solid var(--text);outline-offset:2px}
.bg svg{position:absolute;left:-10%;width:140%;bottom:0;height:40vh;opacity:.3}
.bg svg path{fill:url(#wg)}
#wg stop:nth-child(1){stop-color:var(--orb1,var(--accent))}#wg stop:nth-child(2){stop-color:var(--wave-mid,#7a5cff)}#wg stop:nth-child(3){stop-color:var(--orb2,var(--accent2))}
.bg .w1{animation:drift 26s ease-in-out infinite alternate}.bg .w2{bottom:-4vh;opacity:.22;animation:drift 38s ease-in-out infinite alternate-reverse}.bg .w3{bottom:-9vh;opacity:.16;animation:drift 52s ease-in-out infinite alternate}
.orb{position:absolute;border-radius:50%;filter:blur(60px);opacity:.35;animation:float 18s ease-in-out infinite alternate}
.o1{width:380px;height:380px;background:var(--orb1,var(--accent));left:8%;top:18%}.o2{width:320px;height:320px;background:var(--orb2,var(--accent2));right:6%;top:42%;animation-duration:24s}
@keyframes drift{from{transform:translateX(-4%)}to{transform:translateX(6%)}}
@keyframes float{from{transform:translate(0,0)}to{transform:translate(40px,-30px)}}
/* window chrome: menu bar then brand and tabs */
.chrome{position:sticky;top:0;z-index:30;background:var(--chrome);backdrop-filter:blur(18px) saturate(1.3);border-bottom:1px solid var(--line)}
#menubar{display:flex;align-items:center;gap:2px;padding:3px 10px;border-bottom:1px solid var(--line);font-size:.88rem}
.menu{position:relative}
.menu>button{background:none;border:0;padding:4px 12px;border-radius:6px;cursor:pointer;color:var(--text)}
.menu>button:hover,.menu.open>button{background:var(--panel2)}
.dd{position:absolute;top:100%;left:0;min-width:230px;padding:6px;border-radius:12px;background:var(--chrome);backdrop-filter:blur(22px);border:1px solid var(--line);box-shadow:0 18px 40px #0008;display:none;animation:pop .14s ease both}
.menu.open .dd{display:block}
.menu.right .dd{left:auto;right:0;min-width:300px}
.code.small{font:600 .78rem/1.3 ui-monospace,Consolas,monospace;letter-spacing:.02em;padding:3px 8px;border-radius:8px;word-break:break-all;display:inline-block}
.dd .code.small{font-size:.72rem}
.dd button{display:flex;width:100%;gap:10px;align-items:center;background:none;border:0;text-align:left;padding:7px 12px;border-radius:8px;cursor:pointer;color:var(--text)}
.dd button:hover,.dd button:focus-visible{background:var(--accent);color:#fff;outline:none}
.dd hr{border:0;border-top:1px solid var(--line);margin:5px 4px}
.who{display:flex;align-items:center;gap:8px;background:none;border:1px solid transparent;border-radius:999px;padding:2px 12px 2px 3px;cursor:pointer}
.who:hover{background:var(--panel2);border-color:var(--line)}.who .nm{font-size:.86rem}
header{display:flex;align-items:center;gap:18px;padding:8px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.wordmark{font-weight:800;letter-spacing:.4px;font-size:1.15rem}.wordmark b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{position:relative;background:none;border:0;padding:9px 16px;border-radius:10px;cursor:pointer;color:var(--mute);font-weight:600;transition:color .2s,background .2s}
nav button:hover{color:var(--text);background:var(--panel2)}
nav button.on{color:var(--text)}
nav button.on::after{content:"";position:absolute;left:14px;right:14px;bottom:2px;height:3px;border-radius:3px;background:var(--grad);box-shadow:var(--glow)}
#busybar{position:fixed;top:0;left:0;right:0;height:3px;z-index:60;opacity:0;transition:opacity .2s;background:linear-gradient(90deg,transparent,#4f8cff,#3be0a8,transparent);background-size:40% 100%;background-repeat:no-repeat;animation:slide 1.1s linear infinite}
body.busy #busybar{opacity:1}
@keyframes slide{from{background-position:-40% 0}to{background-position:140% 0}}
main{max-width:1240px;margin:0 auto;padding:22px 20px 60px}
main>*{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}main>*:nth-child(2){animation-delay:.04s}main>*:nth-child(3){animation-delay:.08s}main>*:nth-child(4){animation-delay:.12s}main>*:nth-child(n+5){animation-delay:.16s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}
h2{margin:.2em 0 .6em;font-size:1.5rem;letter-spacing:.2px}h3{margin:1em 0 .4em;font-size:1.05rem}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grow{flex:1}
.card,.panel{background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.025)),var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:0 10px 30px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.1)}
[data-mode=light] .card,[data-mode=light] .panel{box-shadow:0 8px 24px rgba(40,60,130,.12),inset 0 1px 0 #fff}
.btn{background:var(--panel2);border:1px solid var(--line);padding:8px 15px;border-radius:11px;cursor:pointer;transition:transform .12s,border-color .2s,box-shadow .2s}
.btn:hover{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,140,255,.18)}.btn:active{transform:scale(.97)}
.btn.primary{background:var(--grad-btn);border-color:transparent;color:#fff;font-weight:600;box-shadow:0 6px 18px rgba(79,140,255,.35)}
.btn.good{background:linear-gradient(135deg,#34d399,#3be0a8);border-color:transparent;color:#04251c;font-weight:600}.btn.bad{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.modal{position:fixed;inset:0;background:#000b;backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:99;animation:rise .2s both}
.modalbox{background:var(--chrome);backdrop-filter:blur(24px);border:1px solid var(--line);border-radius:18px;padding:22px;max-width:460px;width:90%;box-shadow:0 30px 70px #000a}
input[type=text],input[type=number],input[type=search],select{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,140,255,.22)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chip{padding:6px 13px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-size:.9rem;transition:all .15s}

/* ---------- batch 6: console banners, video page, uninstall, tired doctor ---------- */
.cs{image-rendering:pixelated;display:block}

.a-sway{animation:consway 2.8s ease-in-out infinite;transform-origin:50% 90%}@keyframes consway{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}

.a-joy{animation:conjoy 1.6s ease-in-out infinite;transform-origin:50% 100%}@keyframes conjoy{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}
.a-flip{animation:conflip 3.2s ease-in-out infinite;transform-origin:50% 50%}@keyframes conflip{0%,100%{transform:perspective(300px) rotateX(0)}45%,55%{transform:perspective(300px) rotateX(18deg)}}

.cs.big{filter:drop-shadow(0 8px 14px #0008)}
.conbar{display:flex;gap:10px;overflow-x:auto;padding:6px 2px 12px;scroll-snap-type:x proximity;scrollbar-width:thin}
.conchip{position:relative;flex:0 0 auto;display:flex;align-items:center;gap:8px;min-width:112px;padding:8px 12px 8px 8px;border-radius:14px;color:var(--text);cursor:pointer;scroll-snap-align:center;
 background:linear-gradient(var(--solid),var(--solid)) padding-box,linear-gradient(135deg,var(--c1),var(--c2)) border-box;border:2px solid transparent;transition:transform .15s,box-shadow .15s}

.conchip:hover{transform:translateY(-3px);box-shadow:0 8px 20px #0007}
.conchip:hover .cs{animation-duration:.9s}
.conchip:not(:hover):not(.on) .cs{animation-play-state:paused}
.conchip.on{background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;box-shadow:0 0 0 2px #fff3,0 10px 26px color-mix(in srgb,var(--c1) 55%,transparent);transform:translateY(-3px)}
.conchip.on small{opacity:.9}
.conchip .cust{font-size:.62rem;background:#ffd23f;color:#2b2200;border-radius:99px;padding:1px 7px;font-weight:800;position:absolute;top:-8px;right:8px}
.chip.conmini{display:inline-flex;align-items:center;gap:6px;border-color:var(--c1)}
.chip.conmini.on{background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;border-color:transparent}
.chip.conmini .cico{display:grid;place-items:center;width:26px}.chip.conmini:not(:hover):not(.on) .cs{animation-play-state:paused}
.conbanner{position:relative;display:flex;align-items:center;gap:26px;padding:22px 30px;border-radius:22px;overflow:hidden;color:#fff;min-height:190px;margin:4px 0 18px;
 background:linear-gradient(120deg,var(--c1),var(--c2));box-shadow:0 16px 40px #0007;border:1px solid #fff3}
.conbanner.swap{animation:bannerin .45s cubic-bezier(.2,.9,.3,1) both}@keyframes bannerin{from{opacity:0;transform:translateX(30px) scale(.98)}}
.conbanner .bgfx{position:absolute;inset:0;background:
  repeating-linear-gradient(0deg,#0000 0 3px,#0000001a 3px 4px),
  radial-gradient(circle at 85% 20%,#fff3,transparent 45%);pointer-events:none}
.conbanner .bgfx::before,.conbanner .bgfx::after{content:"";position:absolute;width:10px;height:10px;background:#fff6;box-shadow:60px 40px #fff4,140px -10px #fff5,-80px 70px #fff3,220px 60px #fff4,300px 10px #fff3;animation:drift 9s linear infinite}
.conbanner .bgfx::before{left:35%;top:20%}.conbanner .bgfx::after{left:70%;top:60%;animation-duration:13s;animation-direction:reverse}
@keyframes drift{from{transform:translateY(0)}50%{transform:translateY(-14px)}to{transform:translateY(0)}}
.conbanner .bsprite{position:relative;flex:none;min-width:130px;display:grid;place-items:center}
.conbanner .binfo{position:relative;flex:1;min-width:0}
.conbanner h2{margin:0;font-size:2.1rem;letter-spacing:.5px;text-shadow:0 3px 0 #0004}
.bmaker{font:800 11px ui-monospace,Consolas,monospace;letter-spacing:3px;text-transform:uppercase;opacity:.85}
.btag{opacity:.92;margin:2px 0 10px}
.bstats{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bstats .badge{background:#0004;border-color:#fff4;color:#fff}
.p1{font:800 11px ui-monospace,Consolas,monospace;letter-spacing:2px;color:#ffd23f;text-shadow:0 2px 0 #0006;animation:blinkc 1.1s steps(1) infinite;margin-left:6px}
.conbanner .bemu{position:relative;background:#0004;border-radius:12px;padding:8px 10px}
.tv .tvgrid .tvcard{border-color:color-mix(in srgb,var(--c1) 55%,transparent);animation:cardin .4s both;animation-delay:var(--d,0ms)}
@keyframes cardin{from{opacity:0;transform:translateY(14px) scale(.96)}}
.tv .tvcard.sel{box-shadow:0 0 0 3px var(--c1),0 12px 30px color-mix(in srgb,var(--c1) 50%,transparent);transform:translateY(-4px)}
.tvcard{position:relative}.tvcard .tvcon{position:absolute;top:8px;left:8px;z-index:2;background:#0007;border-radius:8px;padding:3px}
@media(max-width:700px){.conbanner{flex-direction:column;text-align:center}}
/* display page */
.vgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);gap:22px;align-items:start}
@media(max-width:900px){.vgrid{grid-template-columns:1fr}}
.vtiles{display:grid;gap:10px}
.vtile{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:14px;background:var(--solid);border:1px solid var(--line);cursor:pointer;transition:border-color .15s,transform .15s}

.vtile .vt{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.vicon{flex:none;background:#0003;border-radius:8px;padding:6px;box-sizing:content-box}
.switch{position:relative;flex:none;width:46px;height:26px}.switch input{position:absolute;inset:0;opacity:0;cursor:pointer;margin:0;z-index:1}

.pvbox{display:flex;flex-direction:column;gap:8px}

.pvscreen{flex:1;display:grid;place-items:center;min-height:0;background:#000;overflow:hidden}
.pvscreen .pvart{height:84%;width:auto;aspect-ratio:16/13;image-rendering:pixelated;transition:all .3s}
.pvscreen.whole .pvart{height:78%}

.pvtv.full{border-width:0}
.pvtear{position:absolute;left:0;right:0;height:3px;background:#fff8;top:30%;animation:tear 1.4s linear infinite;display:none}@keyframes tear{from{top:-5%}to{top:105%}}
.vhint{display:flex;align-items:center;gap:14px}
.vpanel{border:2px solid var(--c1);background:linear-gradient(135deg,color-mix(in srgb,var(--c1) 30%,var(--solid)),var(--solid) 60%)}
.vphead{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.vpbody{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(260px,1fr);gap:20px;align-items:start}
@media(max-width:900px){.vpbody{grid-template-columns:1fr}}
.vrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.vrow .vt{flex:1;display:flex;flex-direction:column;min-width:140px}.vrow.off{opacity:.55}
.segmented{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.segmented button{background:none;border:0;color:var(--text);padding:6px 10px;cursor:pointer;font:inherit;font-size:.8rem;border-right:1px solid var(--line)}
.segmented button:last-child{border-right:0}.segmented button:hover:not(:disabled){background:#ffffff14}
.segmented button.on{background:linear-gradient(135deg,var(--c1,#3b6bff),var(--c2,#7a5cff));color:#fff;font-weight:700}
.segmented button:disabled{cursor:not-allowed}
/* uninstall */
.unlist{max-height:180px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:6px 10px;margin-bottom:10px}
.unrow{display:flex;flex-direction:column;padding:4px 0;border-bottom:1px solid var(--line);word-break:break-all}.unrow:last-child{border:0}
.unopt{display:flex;gap:10px;align-items:flex-start;margin:8px 0}
/* Home emulators: little character cards */
.estrip{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 10px}
.emini{position:relative;flex:0 0 auto;min-width:150px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);color:#fff;text-align:left;cursor:pointer;background:linear-gradient(150deg,var(--c1),var(--c2));box-shadow:0 8px 18px #0005;transition:transform .15s,box-shadow .15s}
.emini:hover,.emini:focus-visible{transform:translateY(-5px) rotate(-1deg);box-shadow:0 16px 28px #0008,0 0 0 2px #ffffff55;outline:none}
.emini .eicon{animation:bob 3s ease-in-out infinite;animation-delay:var(--d);filter:drop-shadow(0 4px 6px #0006)}
.emini:hover .eicon{animation:hop .6s ease-in-out infinite}
.emini b{font-size:1rem;text-shadow:0 1px 3px #0008}.emini .small{opacity:.95;text-shadow:0 1px 2px #0008}
.emini .alive{position:absolute;right:12px;top:12px;width:10px;height:10px;border-radius:50%;background:#3be0a8;box-shadow:0 0 0 0 #3be0a8aa;animation:alivepulse 2s infinite}
@keyframes alivepulse{0%{box-shadow:0 0 0 0 #3be0a8aa}70%{box-shadow:0 0 0 9px #3be0a800}100%{box-shadow:0 0 0 0 #3be0a800}}
/* hover a game cover to split it into Play and Online */
.cvwrap{position:relative;border-radius:10px;overflow:hidden;margin:-2px 0 6px}
.cvwrap .cv{margin:0}
.quick{position:absolute;inset:0;display:flex;gap:2px;opacity:0;transition:opacity .15s;pointer-events:none}
.game:hover .quick,.game:focus-within .quick{opacity:1;pointer-events:auto}
.quick button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:0;color:#fff;font:800 .95rem/1 inherit;font-family:inherit;cursor:pointer;background:rgba(8,12,40,.78);transition:background .12s,transform .12s;text-shadow:0 1px 3px #000}
.quick button .qi{font-size:1.6rem}
.quick .qplay:hover:not(:disabled),.quick .qplay:focus-visible{background:linear-gradient(160deg,#18b886,#3be0a8cc);outline:none}
.quick .qonline:hover:not(:disabled),.quick .qonline:focus-visible{background:linear-gradient(160deg,#5b7cff,#a45cffcc);outline:none}
.quick button:disabled{cursor:not-allowed;opacity:.6}
.list .quick{display:none}
/* Martin sits on the desk: slow tail sway and a gentle head tilt, a quick wag and head rub while he is being petted */
.sitcat{position:relative;display:block;cursor:pointer;filter:drop-shadow(0 4px 8px #0007)}
.sitcat:focus-visible{outline:2px solid var(--link);outline-offset:4px;border-radius:8px}
.sitcat .catpart{position:absolute;display:block}
.sitcat .cattail{transform-origin:12% 94%;animation:tailidle 3.8s ease-in-out infinite}
.sitcat .cathead{transform-origin:50% 92%;animation:headidle 6s ease-in-out infinite}
.sitcat.petting .cattail{animation:tailwag .3s ease-in-out infinite}
.sitcat.petting .cathead{animation:headrub .5s ease-in-out infinite}
@keyframes tailidle{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(7deg)}}
@keyframes tailwag{0%,100%{transform:rotate(-16deg)}50%{transform:rotate(16deg)}}
@keyframes headidle{0%,70%,100%{transform:rotate(0)}80%{transform:rotate(-3deg)}90%{transform:rotate(2deg)}}
@keyframes headrub{0%,100%{transform:rotate(-7deg) translateY(1px)}50%{transform:rotate(7deg) translateY(2px)}}
/* the doctor runs a scan on his own computer */
.docterm{position:absolute;right:14px;bottom:86px;z-index:5;width:min(230px,46%);background:#06120c;color:#3be0a8;font:12px/1.35 ui-monospace,Consolas,monospace;border:3px solid #2a3350;border-radius:8px;padding:6px 9px 8px;box-shadow:0 0 22px #3be0a844,inset 0 0 18px #0a2a1a;animation:termon .45s ease-out}
.docterm.off{opacity:0;transform:scale(.9);transition:all .6s}
.docterm .dthead{font-weight:800;letter-spacing:2px;color:#9ff5d6;border-bottom:1px dashed #1f6a4d;margin-bottom:4px;padding-bottom:2px}

.docterm .cur{animation:blinkc 1s steps(1) infinite}
@keyframes termon{from{opacity:0;transform:translateY(14px) scale(.85)}to{opacity:1;transform:none}}
.scanline{position:absolute;left:0;right:0;height:4px;z-index:4;pointer-events:none;background:linear-gradient(90deg,transparent,#3be0a8,transparent);box-shadow:0 0 16px #3be0a8;animation:sweep 2.2s ease-in-out infinite}
@keyframes sweep{0%{top:4%}50%{top:92%}100%{top:4%}}
.docspot.scanning .px.doctor{animation:typing .28s steps(2) infinite;transform-origin:50% 100%}
@keyframes typing{0%{transform:translateX(0) rotate(0)}50%{transform:translateX(4px) rotate(2.5deg)}100%{transform:translateX(0) rotate(0)}}
/* a tired doctor */
.docspot .px.doctor.sigh{animation:docsag 3.4s ease-in-out infinite}@keyframes docsag{0%,100%{transform:translateY(0)}50%{transform:translateY(7px) scaleY(.97)}}
.docspot .px.doctor.eyeroll{animation:doclook 2s ease-in-out infinite}@keyframes doclook{0%,100%{transform:rotate(0)}50%{transform:rotate(-4deg) translateY(-2px)}}
.docspot .px.doctor.facepalm{animation:docsag 2.2s ease-in-out infinite}
.docspot .px.doctor.rub{animation:shake .45s ease-in-out infinite}
.docspot .px.doctor.yawn{animation:docyawn 3s ease-in-out infinite}@keyframes docyawn{0%,100%{transform:scale(1)}50%{transform:scale(1.07,.95)}}
.docspot .px.doctor.drum{animation:docdrum .4s steps(2) infinite}@keyframes docdrum{50%{transform:translateY(3px)}}
.docspot .px.doctor.glare{filter:drop-shadow(0 0 10px #ff3b3b) sepia(.4) saturate(2);animation:shake .3s ease-in-out infinite}
.docspot .px.doctor.suspicious{animation:docsus 2.6s ease-in-out infinite;transform-origin:50% 100%}@keyframes docsus{0%,100%{transform:rotate(0)}50%{transform:rotate(6deg)}}
.docspot:has(.doctor.yawn)::after,.docspot:has(.doctor.sigh)::after{content:"z  z";position:absolute;right:-22px;top:10px;font:800 14px ui-monospace,monospace;color:#cfd6ff;animation:fxup 2.4s ease-out infinite}
.docspot:has(.doctor.glare)::after{content:"#!?";position:absolute;right:-18px;top:6px;animation:shake .3s infinite}
.docspot:has(.doctor.suspicious)::after{content:"?";position:absolute;right:-8px;top:0;font:800 26px ui-monospace,monospace;color:#ffd23f;animation:bob 1s infinite}
.docspot{position:relative}
.specgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}

function viewHelp(m){

  sec("games","Your games stay yours","Legacy Player scans your games folder by file type and folder name. It lists files; it never opens, copies, or changes them, and it only removes a game when you choose Uninstall and confirm, and it ships no games, BIOS, or firmware."),
  sec("playing","Playing","Pressing Play starts the emulator you chose for that console with your game. Emulators are separate programs; Legacy Player opens and organizes them. Console mode shows the same library in a big-screen layout you can drive with a pad."),
  sec("saves","How save files work",
   "A game's progress lives in a save file, and a quick snapshot of the exact moment is a save state. They are written by the emulator, not by Legacy Player, so where they end up depends on the emulator.",
   "For RetroArch consoles Legacy Player gives every console its own tidy folder (saves and save states) under one root and passes it to RetroArch each time it launches. Look at Saves to see the folders or move the root, for example into a OneDrive or Dropbox folder if you want them synced.",
   "Other emulators keep their own folders. Under Saves you can point each console at the folder its emulator uses, and backups will copy from there. PS1, PS2 and GameCube use a memory card file that is shared by many games, so one backup holds all of them.",
   "A backup is a plain timestamped copy kept in the Legacy Player data folder. Restoring first backs up whatever is there now, so restoring can never cost you progress. Nothing is ever overwritten without a backup, and game files are never touched."),
  sec("together","Playing together (technical)","A coordination server runs on Windows, Linux, or a Raspberry Pi. Each player's emulator sends button presses; the server releases a frame only when every player's input has arrived (lockstep), and players compare state checksums to detect desync. This only works when the emulator is deterministic, so support is tiered per console and per game."),
  sec("codes","Server codes, invite codes and names","A server code (LP-... or LP2-...) gets a friend to your server. A room invite code lets them into one room. Both expire or can be revoked. Your name comes with a four-character tag from the server so nobody active there shares it. The server stores only hashes of codes. Traffic is encrypted when the server runs with TLS, which internet hosting requires."),
  sec("notify","Notifications","You are told when someone asks to join, joins, leaves, disconnects, is removed by the host, or when the server restarts. A removed player sees the host's reason."),
  sec("server","Starting and stopping the server","Use Servers: Start, Restart and Stop. From a terminal, python -m server.cli start --detach, stop, restart, and status work the same everywhere. Stopping saves rooms; starting resumes them. A match in progress returns to the ready step so everyone re-syncs."),
  sec("match","Starting a match","NES, SNES, Game Boy, GBA, Genesis and Atari start through RetroArch netplay. GameCube and Wii open Dolphin and guide you through its NetPlay window with the room address filled in. Other consoles have rooms and invites but no match launcher yet."),
  sec("privacy","Privacy","Legacy Player doesn't collect data: no analytics, no tracking, no account, nothing sold or shared. Scans, your library, saves and controllers only ever read this computer. Addresses are hidden behind a little eye until you press it, and matches go through the server relay by default so players never learn each other's address.",
   "Each thing that can go online is its own switch, off unless you turn it on: internet downloads, looking up game details (Wikipedia), the friends service, sending problem reports automatically, direct connections and the Tailscale link. The Privacy page (Account menu) lists every one with where it goes and exactly what it sends, and the doctor checks them at every check-up: anything switched on that you never said yes to is flagged until you keep it or turn it off.",

/* Dialogs can be driven from a controller too (Console mode opens cards and the Play options box): D-pad or left stick moves,
   A presses, B closes. Only while a dialog is open; pages keep their own pad handling. */
if(!OVERLAY)(()=>{let was={},hold=0;
 setInterval(()=>{const all=document.querySelectorAll(".modal");const m=all[all.length-1];if(!m)return;
  const p=livePads()[0];if(!p)return;const prof=(S.P&&S.P.profiles[padKey(p)])||null;const lit=litSlots(p,prof);
  const ax=p.axes[0]||0,ay=p.axes[1]||0;const now={l:lit.has(14)||ax<-.6,r:lit.has(15)||ax>.6,u:lit.has(12)||ay<-.6,d:lit.has(13)||ay>.6,a:lit.has(0),b:lit.has(1)};
  const edge=k=>{const e=now[k]&&!was[k];return e};const F='button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])';
  const items=[...m.querySelectorAll(F)].filter(x=>x.offsetParent!==null);const i=items.indexOf(document.activeElement);
  const step=n=>{if(!items.length)return;items[(i<0?0:(i+n+items.length)%items.length)].focus()};
  if(edge("d")||edge("r"))step(1);if(edge("u")||edge("l"))step(-1);
  if(edge("a")){const a=document.activeElement;if(a&&m.contains(a)){if(a.tagName==="SELECT"){a.focus()}else if(a.type==="checkbox"){a.click()}else a.click()}}
  if(edge("b")){const btns=[...m.querySelectorAll("button")].filter(b=>!b.disabled);const c=m.querySelector("[data-cancel]:not([disabled])")||btns.find(b=>/^(cancel|close|not now|no|never mind|done|back|later|✕)/i.test((b.textContent||"").trim()));if(c)c.click()}
  was=now},70)})();
/* Dialogs: Esc closes the top one, Tab stays inside it, and focus goes back to where it was. */
(()=>{
 const FOCUS='button:not([disabled]),[href],input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])';
 const top=()=>{const all=document.querySelectorAll(".modal");return all[all.length-1]||null};
 const opener=new WeakMap();
 new MutationObserver(list=>{for(const m of list){
  for(const n of m.addedNodes){if(n.nodeType===1&&n.classList.contains("modal")){
   opener.set(n,document.activeElement);
   if(!n.contains(document.activeElement)){const f=n.querySelector(".primary")||n.querySelector(FOCUS);if(f)setTimeout(()=>{try{f.focus()}catch(e){}},0)}}}
  for(const n of m.removedNodes){if(n.nodeType===1&&n.classList&&n.classList.contains("modal")){
   const o=opener.get(n);if(o&&document.contains(o)&&!top()){try{o.focus()}catch(e){}}}}}
 }).observe(document.body,{childList:true});
 document.addEventListener("keydown",e=>{
  const m=top();if(!m)return;
  if(e.key==="Escape"){
   if(document.querySelector(".learning"))return;                 // the key-learning box handles its own Esc
   const btns=[...m.querySelectorAll("button")].filter(b=>!b.disabled);
   const cancel=m.querySelector("[data-cancel]:not([disabled])")||btns.find(b=>/^(cancel|close|not now|no|never mind|done|back|later)\b/i.test((b.textContent||"").trim()));
   if(cancel){e.preventDefault();e.stopPropagation();cancel.click()}
   return}
  if(e.key==="Tab"){
   const f=[...m.querySelectorAll(FOCUS)].filter(x=>x.offsetParent!==null);if(!f.length)return;
   const first=f[0],last=f[f.length-1],a=document.activeElement;
   if(!m.contains(a)){e.preventDefault();first.focus()}
   else if(e.shiftKey&&a===first){e.preventDefault();last.focus()}
   else if(!e.shiftKey&&a===last){e.preventDefault();first.focus()}}
 },true);
})();

<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Legacy Player</title>
<style>
:root{--bg:#0f1220;--panel:#171b2e;--panel2:#1f2440;--line:#2b3157;--text:#e8ebff;--mute:#9aa3d0;--accent:#6c8cff;--accent2:#35d0a5;--warn:#ffb454;--bad:#ff6b7a;--r:14px}
[data-theme=light]{--bg:#f4f5fb;--panel:#fff;--panel2:#eef0fa;--line:#d8dcf0;--text:#171a2e;--mute:#5a6190;--accent:#3b5bdb;--accent2:#0b8f6c;--warn:#b25e00;--bad:#c92a3b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,Segoe UI,Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:16px;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.logo{font-weight:800;letter-spacing:.3px}.logo b{color:var(--accent)}
nav{display:flex;gap:6px;flex-wrap:wrap}nav button{background:none;border:0;padding:8px 14px;border-radius:999px;cursor:pointer;color:var(--mute)}
nav button.on{background:var(--accent);color:#fff}nav button:hover:not(.on){background:var(--panel2)}
main{max-width:1200px;margin:0 auto;padding:20px}
h2{margin:.2em 0 .6em;font-size:1.3rem}h3{margin:1em 0 .4em;font-size:1.02rem}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grow{flex:1}
.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.btn{background:var(--panel2);border:1px solid var(--line);padding:8px 14px;border-radius:10px;cursor:pointer}
.btn:hover{border-color:var(--accent)}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.good{background:var(--accent2);border-color:var(--accent2);color:#04251c}.btn.bad{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
input[type=text],input[type=number],input[type=search],select{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chip{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:.9rem}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}.chip small{opacity:.75;margin-left:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-top:12px}
.game{position:relative;padding:14px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:128px}
.game:hover,.game:focus-visible{border-color:var(--accent);outline:none;transform:translateY(-2px)}
.game .t{font-weight:650;line-height:1.25;padding-right:28px}.game .m{color:var(--mute);font-size:.82rem}
.star{position:absolute;top:8px;right:8px;background:none;border:0;font-size:1.25rem;cursor:pointer;color:var(--mute)}.star.on{color:#ffcf40}
.badge{display:inline-block;font-size:.72rem;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--mute)}
.badge.strong{color:var(--accent2);border-color:var(--accent2)}.badge.per-game{color:var(--accent);border-color:var(--accent)}
.badge.experimental,.badge.not-practical{color:var(--warn);border-color:var(--warn)}
.list .game{flex-direction:row;align-items:center;min-height:0;padding:10px 14px}
.muted{color:var(--mute)}.small{font-size:.85rem}.bad{color:var(--bad)}.good{color:var(--accent2)}
.why{background:var(--panel2);border-left:3px solid var(--accent);padding:8px 12px;border-radius:8px;margin:8px 0;color:var(--mute);font-size:.88rem}
.i{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;border:1px solid var(--mute);color:var(--mute);font-size:.7rem;cursor:pointer;margin-left:6px;background:none}
table{border-collapse:collapse;width:100%}td,th{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.code{font:700 2rem/1 ui-monospace,Consolas,monospace;letter-spacing:.12em;background:var(--panel2);padding:12px 18px;border-radius:12px;border:1px dashed var(--accent);display:inline-block}
.drawer{position:fixed;inset:0 0 0 auto;width:min(480px,100%);background:var(--panel);border-left:1px solid var(--line);padding:20px;overflow:auto;z-index:8;box-shadow:-10px 0 30px #0006}
.scrim{position:fixed;inset:0;background:#0007;z-index:7}
#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:20;max-width:360px}
.toast{background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--accent);padding:10px 14px;border-radius:10px;box-shadow:0 6px 20px #0005}
.toast.warn{border-left-color:var(--warn)}.toast.err{border-left-color:var(--bad)}
.feed{max-height:240px;overflow:auto;display:flex;flex-direction:column;gap:6px}.feed div{padding:6px 10px;background:var(--panel2);border-radius:8px}.feed .warn{border-left:3px solid var(--warn)}
.pad{display:flex;gap:6px;flex-wrap:wrap}.pad span{padding:4px 10px;border-radius:8px;border:1px solid var(--line)}.pad span.hit{background:var(--accent2);color:#04251c;border-color:var(--accent2)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;background:var(--bad)}.dot.on{background:var(--accent2)}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media(max-width:600px){main{padding:12px}.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}}
.tv{padding:8px}.tvbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.tvgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.tvcard{padding:22px 14px;border-radius:14px;border:2px solid var(--line);background:var(--panel);min-height:90px;cursor:pointer}.tvcard.sel{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent);transform:scale(1.03)}.tvtitle{font-size:16px;font-weight:600}.tvhelp{margin-top:14px}
</style>
</head>
<body>
<header>
  <div class="logo">Legacy <b>Player</b></div>
  <nav id="nav" aria-label="Sections"></nav>
  <div class="grow"></div>
  <span class="small muted" id="srv"><span class="dot" id="srvdot"></span> <span id="srvtxt">server…</span></span>
</header>
<main id="main"></main>
<div id="toasts" aria-live="polite"></div>
<script>
"use strict";
const TOKEN="__LP_TOKEN__";
const $=(s,r=document)=>r.querySelector(s);
function h(tag,attrs,...kids){const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs||{})){if(k==="class")e.className=v;else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else if(v===true)e.setAttribute(k,"");else if(v!==false&&v!=null)e.setAttribute(k,v)}
 for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(String(c)))}return e}
async function api(name,body={}){const r=await fetch("/api/"+name,{method:"POST",headers:{"Content-Type":"application/json","X-LP-Token":TOKEN},body:JSON.stringify(body)});
 const j=await r.json();if(!r.ok)throw new Error(j.error||"Request failed");return j}
function toast(text,level){const t=h("div",{class:"toast "+(level||"")},text);$("#toasts").append(t);setTimeout(()=>t.remove(),level==="warn"?9000:5000)}
async function act(fn,ok){try{const r=await fn();if(ok)toast(ok);return r}catch(e){toast(e.message,"err")}}
function why(text){const box=h("div",{class:"why",hidden:true},text);const b=h("button",{class:"i","aria-label":"What is this?",title:"What is this?",onclick:()=>{box.hidden=!box.hidden}},"i");return[b,box]}
function whyInline(label,text){const[b,box]=why(text);return h("span",{},label,b,box)}
const NETPLAY={strong:"Good fit",["per-game"]:"Needs a game pack","experimental":"Experimental","not-practical":"Not practical yet"};

const S={tab:"library",console:null,q:"",fav:false,sort:"title",lib:null,settings:null,room:null,online:null,lastNotice:null};
const TABS=[["library","Library"],["together","Play Together"],["console","Console mode"],["setup","Setup"],["engines","Engines"],["controllers","Controllers"],["saves","Saves"],["emulators","Emulators"],["settings","Settings"],["credits","Credits"],["help","How it works"]];

function renderNav(){const n=$("#nav");n.replaceChildren(...TABS.map(([id,l])=>h("button",{class:S.tab===id?"on":"",onclick:()=>{S.tab=id;go()}},l+(id==="together"&&S.room?" ●":""))))}
async function go(){renderNav();const m=$("#main");m.replaceChildren();({library:viewLibrary,together:viewTogether,console:viewConsole,setup:viewSetup,engines:viewEngines,controllers:viewControllers,saves:viewSaves,emulators:viewEmulators,settings:viewSettings,credits:viewCredits,welcome:viewWelcome,help:viewHelp})[S.tab](m)}

/* ---------- Library ---------- */
async function viewLibrary(m){
 const d=S.lib=await api("library",{console:S.console,q:S.q,favorites:S.fav,sort:S.sort});
 const st=S.settings||(S.settings=(await api("settings")).values);
 document.documentElement.dataset.theme=st.theme;
 if(!d.roots.length){m.append(emptyState());return}
 const search=h("input",{type:"search",placeholder:"Search your games",value:S.q,"aria-label":"Search",oninput:e=>{S.q=e.target.value;clearTimeout(S.t);S.t=setTimeout(()=>refreshGrid(),180)}});
 const sort=h("select",{"aria-label":"Sort",onchange:e=>{S.sort=e.target.value;refreshGrid()}},...[["title","A-Z"],["recent","Recently played"],["size","Largest"]].map(([v,l])=>h("option",{value:v,selected:S.sort===v},l)));
 m.append(h("div",{class:"row"},h("h2",{class:"grow"},"Your games ",h("span",{class:"muted small"},d.total+" found")),search,sort,
  h("button",{class:"btn"+(S.fav?" primary":""),onclick:()=>{S.fav=!S.fav;go()}},"★ Favorites ("+d.favorites_total+")"),
  h("button",{class:"btn",onclick:rescan},"Rescan")));
 m.append(h("div",{class:"chips",id:"chips"}));
 m.append(h("div",{id:"gridwrap"}));
 drawChips(d);drawGrid(d);
}
function drawChips(d){const c=$("#chips");c.replaceChildren(h("button",{class:"chip"+(S.console?"":" on"),onclick:()=>{S.console=null;go()}},"All",h("small",{},d.total)),
 ...d.consoles.map(k=>h("button",{class:"chip"+(S.console===k.id?" on":""),title:k.netplay_note,onclick:()=>{S.console=k.id;go()}},k.name,h("small",{},k.count))))}
async function refreshGrid(){const d=S.lib=await api("library",{console:S.console,q:S.q,favorites:S.fav,sort:S.sort});drawGrid(d)}
function drawGrid(d){const w=$("#gridwrap");if(!w)return;
 const list=(S.settings&&S.settings.view)==="list";
 if(!d.games.length){w.replaceChildren(h("p",{class:"muted"},"No games match. Try clearing the search or filters."));return}
 w.replaceChildren(h("div",{class:"grid"+(list?" list":"")},...d.games.map(g=>card(g))),
  d.truncated?h("p",{class:"muted"},"Showing the first 1000. Narrow it with search or a console."):null,
  d.skipped.unrecognized?h("p",{class:"muted small"},d.skipped.unrecognized+" other files were skipped (saves, emulators, or types the launcher does not know). Nothing was changed."):null)}
function card(g){
 const star=h("button",{class:"star"+(g.favorite?" on":""),title:g.favorite?"Remove favorite":"Favorite","aria-label":"Toggle favorite",onclick:async e=>{e.stopPropagation();const r=await act(()=>api("favorite",{id:g.id,favorite:!g.favorite}));if(r){g.favorite=r.favorite;star.classList.toggle("on",r.favorite);star.title=r.favorite?"Remove favorite":"Favorite"}}},"★");
 const showRegion=!S.settings||S.settings.show_region;
 return h("div",{class:"game",tabindex:0,role:"button",onclick:()=>openGame(g.id),onkeydown:e=>{if(e.key==="Enter")openGame(g.id)}},star,
  h("div",{class:"t"},g.title),h("div",{class:"m"},consoleName(g.console)+(showRegion&&g.region?" · "+g.region:"")+" · "+g.size_mb+" MB"),
  g.plays?h("div",{class:"m"},"Played "+g.plays+"×"):null,g.is_archive?h("span",{class:"badge"},"archive "+g.extension):null)}
function consoleName(id){const c=(S.lib&&S.lib.consoles||[]).find(x=>x.id===id);return c?c.name:id}
function emptyState(){const input=h("input",{type:"text",placeholder:"Paste your games folder path, e.g. C:\\Games\\Vimm",style:"min-width:min(480px,100%)"});
 return h("div",{class:"panel"},h("h2",{},"Welcome. Let's find your games."),
  h("p",{},"Point Legacy Player at the folder that holds your game backups. It only ",h("b",{},"looks"),": it never copies, moves, or edits your files."),
  h("div",{class:"row"},input,h("button",{class:"btn primary",onclick:async()=>{const r=await act(()=>api("roots",{roots:[input.value.trim()]}));if(r){await act(()=>api("rescan"),"Library scanned");go()}}},"Scan this folder")))}
async function rescan(){const r=await act(()=>api("rescan"));if(r){toast("Found "+r.games+" games in "+r.seconds+"s");go()}}

async function openGame(id){
 const g=await act(()=>api("game",{id}));if(!g)return;
 const close=()=>{scrim.remove();dr.remove()};
 const scrim=h("div",{class:"scrim",onclick:close});
 const launchBtn=h("button",{class:"btn good",disabled:!g.launch.ready,onclick:async()=>{
   if(S.settings&&S.settings.confirm_launch&&!confirm("Open "+g.title+" in "+g.launch.emulator+"?"))return;
   const r=await act(()=>api("launch",{id}));if(r)toast("Opening "+r.launched+" in "+r.emulator+"…")}},"▶ Play");
 const backups=h("div",{});
 const drawBackups=()=>backups.replaceChildren(...(g.backups.length?g.backups.map(b=>h("div",{class:"row small"},h("span",{class:"grow"},b.backup+" ("+b.files+" file"+(b.files===1?"":"s")+")"),
   h("button",{class:"btn",onclick:async()=>{if(confirm("Restore this backup? Your current saves are backed up first.")){const r=await act(()=>api("restore",{id,backup:b.backup}));if(r)toast("Restored "+r.restored+" file(s)")}}},"Restore"))):[h("span",{class:"muted small"},"No backups yet.")]));drawBackups();
 const dr=h("aside",{class:"drawer",role:"dialog","aria-label":g.title},
  h("div",{class:"row"},h("h2",{class:"grow"},g.title),h("button",{class:"btn",onclick:close,"aria-label":"Close"},"✕")),
  h("div",{class:"muted"},g.console_name+(g.region?" · "+g.region:"")+" · "+g.size_mb+" MB"),
  h("div",{class:"row",style:"margin:12px 0"},launchBtn,h("button",{class:"btn",onclick:async()=>{const r=await act(()=>api("favorite",{id,favorite:!g.favorite}));if(r){g.favorite=r.favorite;toast(r.favorite?"Added to favorites":"Removed from favorites");refreshGrid()}}},"★ Favorite")),
  g.launch.ready?h("p",{class:"small muted"},"Will open in "+g.launch.emulator+"."):h("p",{class:"small bad"},g.launch.reason),
  h("h3",{},whyInline("Playing with friends",
    "Online play works by sending each player's button presses to everyone and running the game in lockstep. How well that works depends on the console and on a per-game 'game pack'. Nothing is faked: the label below is the honest status.")),
  h("p",{},h("span",{class:"badge "+g.netplay},NETPLAY[g.netplay]||g.netplay)," ",h("span",{class:"small muted"},g.netplay_note)),
  g.netplay_launch?h("p",{class:"small"},g.netplay_launch.ready?h("span",{class:"good"},"Play Together: ready"+(g.netplay_launch.experimental?" (experimental)":"")):h("span",{class:"muted"},"Play Together: "+g.netplay_launch.reason),g.netplay_launch.note?h("div",{class:"muted"},g.netplay_launch.note):null):null,
  h("div",{class:"row"},h("button",{class:"btn primary",onclick:async()=>{const r=await act(()=>api("mp_host",{id}));if(r){S.room=r.room;S.tab="together";close();go();poll()}}},"Host a room"),
    h("button",{class:"btn",onclick:()=>{close();S.tab="together";S.joinGame=id;go()}},"Join with a code")),
  h("h3",{},whyInline("Controller for this console",controllerWhy())),
  h("p",{class:"small"},g.controller.label+": "+g.controller.buttons.slice(0,6).map(b=>b.name+" → "+b.physical.split(" (")[0]).join(", ")+"…"),
  h("button",{class:"btn",onclick:()=>{close();S.tab="controllers";S.ctrl=g.console;go()}},"Edit or test controller"),
  h("h3",{},whyInline("Save files","Backups are plain copies of this game's save files, kept in your Legacy Player data folder with a timestamp. Restoring first backs up whatever is there now, so you cannot lose progress by restoring.")),
  g.save_source?h("p",{class:"small muted"},"Looking in: "+g.save_source):h("p",{class:"small muted"},g.console_name+" saves live on a shared memory card or inside the emulator. Set a save folder in Settings to back them up."),
  g.save_files.length?h("p",{class:"small"},"Found: "+g.save_files.join(", ")):h("p",{class:"small muted"},"No save files found yet."),
  h("button",{class:"btn",onclick:async()=>{const r=await act(()=>api("backup",{id}));if(r){toast("Backed up "+r.files+" file(s)");const fresh=await api("game",{id});g.backups=fresh.backups;drawBackups()}}},"Back up saves now"),
  h("div",{style:"margin-top:8px"},backups));
 document.body.append(scrim,dr);
}
function controllerWhy(){return"Every pad is read in a standard layout. Each console has its own buttons, so Legacy Player maps your pad to that console automatically. You can change any mapping in Controllers."}

/* ---------- Play Together ---------- */
async function pingServer(){const r=await api("server_status").catch(()=>({online:false}));S.online=r.online;$("#srvdot").className="dot"+(r.online?" on":"");$("#srvtxt").textContent=r.online?"multiplayer server online":"multiplayer server offline";return r}
async function viewTogether(m){
 const st=await pingServer();
 m.append(h("h2",{},"Play Together"),
  h("div",{class:"why"},"A room is a private lobby on a server you or a friend runs. People join with a short invite code. Nobody else can see it."));
 const share=h("input",{type:"checkbox",id:"srvshare"});
 const srvAct=async(action)=>{const r=await act(()=>api("server_control",{action,share:share.checked}));if(r){toast(r.message);go()}};
 m.append(h("div",{class:"panel"},
  st.online?h("b",{class:"good"},"The multiplayer server is running. "):h("b",{class:"bad"},"The multiplayer server is not running. "),
  h("div",{class:"small muted"},whyInline("What is the server?","The server is a small program that keeps rooms and invite codes. One person runs it (you can run it here); everyone else just sets its address in Settings. It keeps your rooms when you stop it and restores them when you start it again.")," ",st.message||""),
  h("div",{class:"row",style:"margin-top:8px"},
   h("button",{class:"btn primary",onclick:()=>srvAct("start")},"Start server"),
   h("button",{class:"btn",onclick:()=>srvAct("restart")},"Restart"),
   h("button",{class:"btn",onclick:()=>srvAct("stop")},"Stop"),
   h("label",{class:"small"},share," Let friends connect (always encrypted with this app's own certificate)")),
  h("div",{id:"srvinfo",class:"small muted",style:"margin-top:6px"})));
 (async()=>{const info=await api("server_control",{action:"status",share:true}).catch(()=>null);const el=$("#srvinfo");if(!el||!info)return;
   el.replaceChildren(info.fingerprint?h("div",{},"Friends set your address and this fingerprint in Settings > Multiplayer: ",h("span",{class:"code"},info.fingerprint),h("button",{class:"btn",onclick:()=>{navigator.clipboard&&navigator.clipboard.writeText(info.fingerprint);toast("Copied")}},"Copy")):null,
    h("div",{},"Limits when started here: "+info.limits.players+" players per room, "+info.limits.rooms+" rooms, waiting line "+info.limits.waiting+" (change in Settings > Your server)"))})();
 const s=await api("mp_state");S.room=s.room;S.waits=s.waits||[];
 if(s.notice)toast(s.notice,s.level);(s.wait_events||[]).forEach(e=>toast(e.text,e.level));
 const waitsBox=h("div",{id:"waits"});m.append(waitsBox);drawWaits(waitsBox);
 const box=h("div",{id:"room"});m.append(box);drawRoom(box);
 if(!S.room){
  const games=(await api("library",{})).games;
  const sel=h("select",{"aria-label":"Game"},...games.map(g=>h("option",{value:g.id,selected:S.joinGame===g.id},g.title+" ("+consoleName(g.console)+")")));
  const code=h("input",{type:"text",placeholder:"XXXXX-XXXXX",maxlength:12,style:"width:160px","aria-label":"Invite code"});
  const approve=h("input",{type:"checkbox",checked:true,id:"appr"});
  const maxp=h("select",{"aria-label":"Player limit",title:"How many people can play at once. Others wait in line."},...[2,3,4,5,6,7,8].map(n=>h("option",{value:n,selected:n===4},String(n))));
  const openRoom=h("input",{type:"checkbox",id:"openroom"});const label=h("input",{type:"text",placeholder:"Room name (optional)",maxlength:48,style:"width:200px"});
  m.append(h("div",{class:"card",style:"margin-top:14px"},h("h3",{},"Pick the game you will play"),h("div",{class:"row"},sel),
   h("p",{class:"small muted"},"Everyone in a room must have the same game and region. The host can check this before starting."),
   h("div",{class:"row"},h("label",{class:"small"},"Players ",maxp),
    h("button",{class:"btn primary",onclick:async()=>{const r=await act(()=>api("mp_host",{id:sel.value,require_approval:approve.checked,max_players:+maxp.value,open:openRoom.checked,label:label.value}));if(r){S.room=r.room;go();poll()}}},"Host a room"),
    h("label",{class:"small"},approve," Ask me to approve each person")),
   h("div",{class:"row"},h("label",{class:"small"},openRoom," Open room: anyone on this server can see it and walk in or wait in line"),label),
   h("h3",{},whyInline("Join a friend","Ask the host for their code. Codes expire in 15 minutes and can be revoked. They travel encrypted only if the server uses TLS, which is required for internet play.")),
   h("div",{class:"row"},code,h("button",{class:"btn good",onclick:async()=>{const r=await act(()=>api("mp_join",{id:sel.value,invite_code:code.value}));if(r){S.room=r.room;go();poll()}}},"Join"))));
 }
 if(st.online){const bb=h("div",{id:"browse"});m.append(bb);drawBrowse(bb)}
}

/* ---------- Settings ---------- */
async function viewSettings(m){
 const s=await api("settings");S.settings=s.values;const roots=await api("roots");
 const groups={};Object.entries(s.schema).forEach(([k,sp])=>{(groups[sp.group]=groups[sp.group]||[]).push([k,sp])});
 m.append(h("h2",{},"Settings"));
 const rootIn=h("input",{type:"text",placeholder:"Add a games folder path",style:"min-width:min(420px,100%)"});
 m.append(h("div",{class:"card"},h("h3",{},whyInline("Library folders","These folders are read-only. Saves, emulators and BIOS folders inside them are skipped when listing games.")),
  ...roots.roots.map(r=>h("div",{class:"row"},h("code",{class:"grow"},r),h("button",{class:"btn bad",onclick:async()=>{await act(()=>api("roots",{roots:roots.roots.filter(x=>x!==r)}));go()}},"Remove"))),
  h("div",{class:"row",style:"margin-top:8px"},rootIn,h("button",{class:"btn primary",onclick:async()=>{if(!rootIn.value.trim())return;const r=await act(()=>api("roots",{roots:[...roots.roots,rootIn.value.trim()]}));if(r){await act(()=>api("rescan"),"Library scanned");go()}}},"Add and scan"))));
 for(const[g,items]of Object.entries(groups)){
  m.append(h("div",{class:"card",style:"margin-top:14px"},h("h3",{},g),...items.map(([k,sp])=>{
   let ctl;const v=s.values[k];
   const save=async val=>{const r=await act(()=>api("settings",{key:k,value:val}));if(r){S.settings=r.values;if(k==="theme")document.documentElement.dataset.theme=val;if(k==="view"||k==="show_region")toast("Saved")}};
   if(sp.type==="bool")ctl=h("input",{type:"checkbox",checked:v,onchange:e=>save(e.target.checked)});
   else if(sp.type==="choice")ctl=h("select",{onchange:e=>save(e.target.value)},...sp.choices.map(c=>h("option",{value:c,selected:c===v},c)));
   else if(sp.type==="int")ctl=h("input",{type:"number",value:v,min:sp.min,max:sp.max,onchange:e=>save(+e.target.value)});
   else ctl=h("input",{type:"text",value:v,onchange:e=>save(e.target.value)});
   return h("div",{style:"margin:10px 0"},h("div",{class:"row"},h("label",{class:"grow"},sp.label),ctl),h("div",{class:"small muted"},sp.help))})));
 }
}

/* ---------- Help ---------- */
function viewHelp(m){
 const sec=(t,...p)=>h("div",{class:"card",style:"margin-bottom:12px"},h("h3",{},t),...p.map(x=>h("p",{},x)));
 m.append(h("h2",{},"How it works"),
  sec("Your games stay yours","Legacy Player scans your games folder by file type and folder name. It lists files; it never opens, copies, moves, or changes them, and it ships no games, BIOS, or firmware."),
  sec("Playing","Pressing Play starts the emulator you chose for that console with your game. Emulators are separate programs; Legacy Player opens and organizes them."),
  sec("Playing together (technical)","A coordination server runs on Windows, Linux, or a Raspberry Pi. Each player's emulator sends button presses; the server releases a frame only when every player's input has arrived (lockstep), and players compare state checksums to detect desync. This only works when the emulator is deterministic, so support is tiered per console and per game."),
  sec("Invite codes and privacy","A code like ABCDE-FGH12 is a secret that lets someone ask to join one room. It expires, has a use limit, can be cancelled, and wrong guesses are rate-limited. The server stores only hashes. Traffic is encrypted when the server runs with TLS, which internet hosting requires."),
  sec("Notifications","You are told when someone asks to join, joins, leaves, disconnects, is removed by the host, or when the server restarts. A removed player sees the host's reason."),
  sec("Starting and stopping the server","python -m server.cli start --detach, stop, restart, and status work the same everywhere. Stopping saves rooms; starting resumes them. A match in progress returns to the ready step so everyone re-syncs."),
  sec("Starting a match","NES, SNES, Game Boy, GBA, Genesis and Atari start through RetroArch netplay. GameCube and Wii open Dolphin and guide you through its NetPlay window with the room address filled in. Other consoles have rooms and invites but no match launcher yet."));
}

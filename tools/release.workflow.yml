name: release

# Push a tag like v0.7.9 (git tag v0.7.9 && git push origin v0.7.9) to build the Windows app and publish it as a release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write          # lets GitHub vouch for where the files were built (build provenance)
  attestations: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: The tag must match the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = (Select-String -Path launcher/version.py -Pattern '^VERSION\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if ("v$v" -ne "${{ github.ref_name }}") { Write-Error "Tag ${{ github.ref_name }} does not match VERSION $v in launcher/version.py"; exit 1 }
      - name: Python has what the app needs bundled
        shell: pwsh
        run: python -c "import tkinter, ctypes; print('tkinter', tkinter.TkVersion)"
      - name: Build the zip
        shell: pwsh
        # Code signing is optional: add repository secrets WINDOWS_SIGN_PFX_BASE64 (the .pfx file as base64) and
        # WINDOWS_SIGN_PFX_PASSWORD to sign the exe. Without them the release is built and clearly marked unsigned.
        env:
          LP_SIGN_PFX_BASE64: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
          LP_SIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGN_PFX_PASSWORD }}
        run: ./tools/package_release.ps1
      - name: Check the built app starts
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist/release/*.zip | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath smoke
          $p = Start-Process smoke/LegacyPlayer.exe -ArgumentList '--no-browser','--port','18780','--data-dir',"$PWD/smoke-data" -PassThru
          Start-Sleep 12
          try { $r = Invoke-WebRequest http://127.0.0.1:18780/ -UseBasicParsing -SkipHttpErrorCheck; Write-Host "Server answered $($r.StatusCode)" }
          catch { Write-Error "The app started but its page did not answer: $($_.Exception.Message)"; exit 1 }
          if ($p.HasExited) { Write-Error "LegacyPlayer.exe exited early (code $($p.ExitCode))"; exit 1 }
          $log = Join-Path $env:LOCALAPPDATA 'LegacyPlayer/app.log'
          if ((Test-Path $log) -and (Select-String -Path $log -Pattern 'Traceback' -Quiet)) { Get-Content $log; exit 1 }
          taskkill /f /t /pid $p.Id | Out-Null      # the one-file exe starts a child: end both
      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true      # some private repositories cannot attest; the release must not fail for that
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/release/*'
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # PowerShell does not expand * for a program like gh, so list the files ourselves
          $files = Get-ChildItem dist/release -File | ForEach-Object { $_.FullName }
          if (-not $files) { Write-Error "Nothing to publish in dist/release"; exit 1 }
          gh release create "${{ github.ref_name }}" @files --title "Legacy Player ${{ github.ref_name }}" --generate-notes
      - name: Keep the build for manual runs
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: LegacyPlayer-win64
          path: dist/release/*
